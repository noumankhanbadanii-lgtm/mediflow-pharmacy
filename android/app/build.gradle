plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mediflow.pharmacy'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mediflow.pharmacy'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release {
            minifyEnabled false
            // A development-signed release is directly installable. Supply a private
            // release keystore before distributing future production updates.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
